[project]
name = "application"
version = "0.1.0"
description = "UV-based Python project template with YAML-driven logging and environment management."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
]

[project.scripts]
runapp = "application.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.12.7",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.22.0",
]

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
